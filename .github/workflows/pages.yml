name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Actions 的出口 IP 在境外，体彩官网接口会直接 567 拒绝，
      # 所以这里不实时抓取，直接用仓库里提交的 data/offline.json 快照。
      # 快照由本机每天刷新后提交（体彩一三六 21:25 开奖）。
      - name: Build static site
        env:
          USE_SNAPSHOT: '1'
        run: node scripts/build-static.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
